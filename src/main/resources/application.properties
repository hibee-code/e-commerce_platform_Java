spring.application.name=${SPRING_APPLICATION_NAME:E-commerce}

# Load .env in non-prod by default (DotenvEnvironmentPostProcessor skips prod profile)
app.dotenv.enabled=${APP_DOTENV_ENABLED:true}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA (override in prod with env if needed)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:true}
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expirationMinutes=${APP_JWT_EXPIRATION_MINUTES:1440}

# Paystack
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.connect-timeout=${PAYSTACK_CONNECT_TIMEOUT:2s}
paystack.read-timeout=${PAYSTACK_READ_TIMEOUT:5s}
paystack.retry.max-attempts=${PAYSTACK_RETRY_MAX_ATTEMPTS:3}
paystack.retry.backoff=${PAYSTACK_RETRY_BACKOFF:500ms}
paystack.retry.max-backoff=${PAYSTACK_RETRY_MAX_BACKOFF:2s}
paystack.retry.jitter=${PAYSTACK_RETRY_JITTER:0.2}

# One-time admin setup (enable explicitly when needed)
app.setup.admin.enabled=${APP_SETUP_ADMIN_ENABLED:false}

# Rate limiting (auth endpoints)
app.rate-limit.auth.enabled=${APP_RATE_LIMIT_AUTH_ENABLED:true}
app.rate-limit.auth.redis-enabled=${APP_RATE_LIMIT_AUTH_REDIS_ENABLED:false}
app.rate-limit.auth.redis-key-prefix=${APP_RATE_LIMIT_AUTH_REDIS_KEY_PREFIX:rate:auth:}
app.rate-limit.auth.capacity=${APP_RATE_LIMIT_AUTH_CAPACITY:5}
app.rate-limit.auth.refill-tokens=${APP_RATE_LIMIT_AUTH_REFILL_TOKENS:5}
app.rate-limit.auth.refill-duration=${APP_RATE_LIMIT_AUTH_REFILL_DURATION:1m}
app.rate-limit.auth.max-entries=${APP_RATE_LIMIT_AUTH_MAX_ENTRIES:10000}

# Logging
logging.level.org.flywaydb=${LOGGING_LEVEL_FLYWAY:INFO}
logging.level.org.springframework.boot.autoconfigure.flyway=${LOGGING_LEVEL_SPRING_FLYWAY:INFO}

# Swagger / OpenAPI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
