services:
  db:
    image: postgres:16
    container_name: ecommerce-db
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/ecommerce_db
      DB_USERNAME: ecommerce_user
      DB_PASSWORD: ecommerce_password
      APP_JWT_SECRET: change-this-to-a-strong-secret-32chars
      PAYSTACK_SECRET_KEY: change-this-paystack-secret
      PAYSTACK_CALLBACK_URL: http://localhost:8080/api/v1/user/payments/verify
      APP_RATE_LIMIT_AUTH_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
